# Public discussion UI; administrative APIs stay on the separately authenticated runtime.
map $uri $discussion_cache_control {
  default "no-cache";
  ~^/(assets|font)/ "public, max-age=31536000, immutable";
  ~^/api/ "no-store";
  /config.json "no-store";
  /runtime-config.js "no-store";
}

server {
  listen 80;
  listen [::]:80;
  root /app;
  client_max_body_size 1m;
  add_header X-Frame-Options DENY always;
  add_header Content-Security-Policy "frame-ancestors 'none'" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Cache-Control $discussion_cache_control always;

  location ^~ /api/project-wizard/ {
    proxy_pass http://mindroom:8765;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 150s;
    proxy_buffering off;
    proxy_hide_header Cache-Control;
  }

  location = /api { return 404; }
  location /api/ { return 404; }
  location = /v1 { return 404; }
  location /v1/ { return 404; }

  location = /authentication-recovery-probe { return 204; }

  # The client uses relative asset URLs, so keep its entry route slashless.
  location = /discussion/ {
    absolute_redirect off;
    return 308 /discussion$is_args$args;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
