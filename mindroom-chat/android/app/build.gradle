apply plugin: 'com.android.application'

def uploadKeystorePropertiesFile = file("${System.properties['user.home']}/.android/mindroom-upload-keystore.properties")
def uploadKeystoreProperties = new Properties()
if (uploadKeystorePropertiesFile.exists()) {
    uploadKeystorePropertiesFile.withInputStream { inputStream ->
        uploadKeystoreProperties.load(inputStream)
    }
}
def requiredUploadKeystoreProperties = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword']
def hasUploadKeystoreProperties = requiredUploadKeystoreProperties.every { propertyName ->
    uploadKeystoreProperties[propertyName]?.toString()?.trim()
}
def mindroomAndroidVersionCodeOverride = System.getenv('MINDROOM_ANDROID_VERSION_CODE')?.trim()
def mindroomAndroidVersionCode = 30
if (mindroomAndroidVersionCodeOverride) {
    if (!mindroomAndroidVersionCodeOverride.isInteger()) {
        throw new GradleException("MINDROOM_ANDROID_VERSION_CODE must be an integer, got '${mindroomAndroidVersionCodeOverride}'")
    }
    mindroomAndroidVersionCode = mindroomAndroidVersionCodeOverride.toInteger()
    if (mindroomAndroidVersionCode <= 0) {
        throw new GradleException("MINDROOM_ANDROID_VERSION_CODE must be positive, got '${mindroomAndroidVersionCodeOverride}'")
    }
}
def mindroomAndroidVersionName = System.getenv('MINDROOM_ANDROID_VERSION_NAME')?.trim() ?: "4.11.1"

android {
    namespace = "com.mindroom_ai.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.mindroom_ai.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode mindroomAndroidVersionCode
        versionName mindroomAndroidVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasUploadKeystoreProperties) {
                storeFile file(uploadKeystoreProperties['storeFile'])
                storePassword uploadKeystoreProperties['storePassword']
                keyAlias uploadKeystoreProperties['keyAlias']
                keyPassword uploadKeystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            if (hasUploadKeystoreProperties) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
