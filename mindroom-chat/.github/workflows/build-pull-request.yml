name: Build pull request

on:
  pull_request:
    types: ['opened', 'synchronize']

jobs:
  build-pull-request:
    name: Build pull request
    runs-on: ubuntu-latest
    env:
      PR_NUMBER: ${{github.event.number}}
      PR_BASE_SHA: ${{github.event.pull_request.base.sha}}
      PR_HEAD_SHA: ${{github.event.pull_request.head.sha}}
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Setup node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.node-version'
          package-manager-cache: false
      - name: Fetch configured upstream source base
        run: >-
          node scripts/report-non-mindroom-source-diff.mjs
          --fetch-configured-upstream https://github.com/cinnyapp/cinny.git
      - name: Test upstream source report
        run: node --test scripts/report-non-mindroom-source-diff.test.mjs
      - name: Report upstream source footprint
        run: |
          node scripts/report-non-mindroom-source-diff.mjs --pr-base "$PR_BASE_SHA" --head "$PR_HEAD_SHA" --format markdown >> "$GITHUB_STEP_SUMMARY"
          node scripts/report-non-mindroom-source-diff.mjs --pr-base "$PR_BASE_SHA" --head "$PR_HEAD_SHA" --format json > upstream-source-footprint.json
      - name: Upload upstream source footprint
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: upstream-source-footprint
          path: upstream-source-footprint.json
          retention-days: 7
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm run test
      - name: Test parallel browser runner
        run: npm run test:e2e:runner
      - name: Test App Store screenshot fixture
        run: node --test scripts/appstore-fixture.test.mjs
      - name: Test streaming stress seeder
        run: node --test scripts/seed-streaming-stress-room.test.mjs
      - name: Check imports resolve the same on case-insensitive disks
        run: node --test scripts/case-insensitive-imports.test.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Check changed-file formatting
        run: |
          git diff --name-only --diff-filter=ACMR -z "$PR_BASE_SHA"...HEAD |
            xargs -0 --no-run-if-empty npx prettier --check --ignore-unknown --
      - name: Build app
        env:
          NODE_OPTIONS: '--max_old_space_size=4096'
        run: npm run build
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preview
          path: dist
          retention-days: 1
      - name: Save pr number
        run: echo ${PR_NUMBER} > ./pr.txt
      - name: Upload pr number
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr
          path: ./pr.txt
          retention-days: 1
