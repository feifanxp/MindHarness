name: Docker publish (push)

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  publish-image:
    name: Publish Docker image to ghcr.io
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: docker-publish-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.0
        with:
          fetch-depth: 0
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3.6.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.11.1
      - name: Login to ghcr.io
        uses: docker/login-action@v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5.8.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=commit-
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Resolve release version
        id: release_version
        run: |
          # The release workflow tags dev commits while this job runs.
          git fetch --force --tags origin
          echo "version=$(node scripts/release-version.mjs)" >> "$GITHUB_OUTPUT"
      - name: Build and push Docker image
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            MINDROOM_BUILD_VERSION=${{ github.sha }}
            MINDROOM_RELEASE_VERSION=${{ steps.release_version.outputs.version }}
