name: Chat UI backend contract

on:
  pull_request:
    paths:
      - '.github/workflows/chat-ui-backend-contract.yml'
      - 'src/app/mindroom/ui-actions/__fixtures__/chatUiBackendContract.json'
      - 'src/app/mindroom/ui-actions/chatUiBackendContract.test.ts'
      - 'src/app/mindroom/ui-actions/chatUiProtocol.ts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-contract:
    name: Verify backend wire contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MindRoom Chat
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Checkout pinned MindRoom backend
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: mindroom-ai/mindroom
          ref: 7c6d7ef4676bfb6d5b5a932a62bffbf73041f3d2
          path: mindroom-contract
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - name: Install backend test dependencies
        working-directory: mindroom-contract
        run: uv sync --locked --group dev
      - name: Generate contract from real backend tools
        working-directory: mindroom-contract
        run: >-
          uv run --locked --group dev -m tests.chat_ui_contract_fixture
          --output "$GITHUB_WORKSPACE/generated-chat-ui-contract.json"
      - name: Compare generated contract with committed fixture
        run: |
          fixture=src/app/mindroom/ui-actions/__fixtures__/chatUiBackendContract.json
          if ! cmp --silent "$fixture" generated-chat-ui-contract.json; then
            diff --unified "$fixture" generated-chat-ui-contract.json
            exit 1
          fi
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.node-version'
          package-manager-cache: false
      - name: Install client dependencies
        run: npm ci
      - name: Parse generated backend events in the real client parser
        env:
          CHAT_UI_CONTRACT_FIXTURE: ${{ github.workspace }}/generated-chat-ui-contract.json
        run: npx vitest run src/app/mindroom/ui-actions/chatUiBackendContract.test.ts
